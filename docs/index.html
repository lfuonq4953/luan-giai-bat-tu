<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Luận Giải Lá Số</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet">
<style>/* Bố cục: một cột đọc, lá số dạng bảng như mệnh bàn giấy; màu ngũ hành là hệ màu chính, mực chàm làm điểm nhấn, son đỏ chỉ dành cho ấn triện. */
:root {
  --bg: #f2efe8;          /* giấy dó */
  --surface: #fbfaf6;
  --ink: #1d1f24;
  --ink-soft: #5d6068;
  --line: #dcd6c8;
  --accent: #233c63;      /* mực chàm */
  --accent-soft: #e3e8f1;
  --seal: #b0302a;        /* son ấn triện */
  --seal-ink: #fff7f0;
  --gold: #a77d2e;
  --good: #2c7a46; --bad: #b0302a;
  --warn-bg: #fbf1d8; --warn-fg: #6b4b00; --warn-line: #ecd48f;
  --err-bg: #fbe6e2; --err-fg: #8b1e1e; --err-line: #efb4a9;
  --r5-bg: #d8efe0; --r5-fg: #1d6b3a; --r4-bg: #e8f3e3; --r4-fg: #3a7a2b; --r3-bg: #ece8de; --r3-fg: #5d5648; --r2-bg: #fbe7d6; --r2-fg: #94480f; --r1-bg: #f7d9d4; --r1-fg: #962317;
  --moc: #2c7a46; --hoa: #c0392b; --tho: #9a6a1f; --kim: #626873; --thuy: #1f5c9e;
  --radius: 12px;
  --serif: 'Noto Serif', Georgia, 'Times New Roman', serif;
  --sans: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #121418; --surface: #1b1e24; --ink: #e9e6df; --ink-soft: #a3a6ad; --line: #2d3139;
    --accent: #9bb4dc; --accent-soft: #1f2a3b; --seal: #d9574a; --seal-ink: #1b0d0b; --gold: #d8ae5a; --good: #67c088; --bad: #ef7464;
    --warn-bg: #352c14; --warn-fg: #f0d58c; --warn-line: #5f4d1f; --err-bg: #3a1c18; --err-fg: #f6b2a7; --err-line: #6b2c24;
    --r5-bg: #1d3b26; --r5-fg: #8fe0a8; --r4-bg: #23361f; --r4-fg: #b4dc9e; --r3-bg: #2a2d33; --r3-fg: #c9c6bd; --r2-bg: #3d2a19; --r2-fg: #f0b27a; --r1-bg: #43201b; --r1-fg: #f49d90;
    --moc: #67c088; --hoa: #ef7464; --tho: #d6a252; --kim: #b9bec7; --thuy: #6aa5ea;
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #121418; --surface: #1b1e24; --ink: #e9e6df; --ink-soft: #a3a6ad; --line: #2d3139;
  --accent: #9bb4dc; --accent-soft: #1f2a3b; --seal: #d9574a; --seal-ink: #1b0d0b; --gold: #d8ae5a; --good: #67c088; --bad: #ef7464;
  --warn-bg: #352c14; --warn-fg: #f0d58c; --warn-line: #5f4d1f; --err-bg: #3a1c18; --err-fg: #f6b2a7; --err-line: #6b2c24;
  --r5-bg: #1d3b26; --r5-fg: #8fe0a8; --r4-bg: #23361f; --r4-fg: #b4dc9e; --r3-bg: #2a2d33; --r3-fg: #c9c6bd; --r2-bg: #3d2a19; --r2-fg: #f0b27a; --r1-bg: #43201b; --r1-fg: #f49d90;
  --moc: #67c088; --hoa: #ef7464; --tho: #d6a252; --kim: #b9bec7; --thuy: #6aa5ea;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
button { font: inherit; cursor: pointer; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 0 56px; }

/* Đầu trang */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.seal { flex: 0 0 44px; width: 44px; height: 44px; border-radius: 6px; background: var(--seal); color: var(--seal-ink); display: grid; place-items: center; font-family: var(--serif); font-weight: 700; font-size: 15px; line-height: 1; box-shadow: inset 0 0 0 3px var(--seal), inset 0 0 0 4px var(--seal-ink); }
.brand h1 { font-family: var(--serif); font-size: 21px; margin: 0; line-height: 1.2; }
.brand p { margin: 0; color: var(--ink-soft); font-size: 13px; }
.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); padding: 7px 12px; border-radius: 8px; }
.ghost:hover { border-color: var(--accent); color: var(--accent); }

/* Trang nhập liệu */
.hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; align-items: stretch; margin-top: 4px; }
.hero > * { min-width: 0; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; min-width: 0; }
.hero h2 { font-family: var(--serif); font-size: clamp(24px, 4vw, 32px); line-height: 1.25; margin: 6px 0 10px; }
.hero .lead { color: var(--ink-soft); margin: 0 0 16px; max-width: 60ch; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.steps li { display: flex; gap: 10px; align-items: flex-start; }
.steps b { flex: 0 0 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 13px; }
.drop { border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 28px 16px; text-align: center; transition: border-color .15s, background .15s; background: var(--surface); min-height: 260px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop .glyph { font-family: var(--serif); font-size: 40px; color: var(--seal); line-height: 1; }
.btn { background: var(--accent); color: var(--surface); border: 0; padding: 10px 18px; border-radius: 8px; font-weight: 600; }
.btn:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.muted { color: var(--ink-soft); font-size: 13px; }
.alert { border-radius: 8px; padding: 10px 12px; font-size: 14px; margin: 10px 0; }
.alert.warn { background: var(--warn-bg); color: var(--warn-fg); border: 1px solid var(--warn-line); }
.alert.err { background: var(--err-bg); color: var(--err-fg); border: 1px solid var(--err-line); }
.spinner { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; display: inline-block; animation: spin .8s linear infinite; vertical-align: -3px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }

/* Form xác nhận */
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--ink-soft); min-width: 0; }
label.f input, label.f select, .pillar-input select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-width: 0; width: 100%; }
.pillar-inputs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 14px 0; }
@media (max-width: 640px) { .pillar-inputs { grid-template-columns: repeat(2, 1fr); } }
.pillar-input { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--bg); display: grid; gap: 6px; min-width: 0; }
.pillar-input h4 { margin: 0; font-size: 13px; color: var(--ink-soft); font-weight: 600; }

/* Kết quả */
.sumbar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
@media (max-width: 860px) { .sumbar { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { border-top: 2px solid var(--line); padding: 10px 2px 0; min-width: 0; }
.stat .k { font-size: 11.5px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .06em; }
.stat .v { font-family: var(--serif); font-size: 19px; font-weight: 700; margin-top: 2px; line-height: 1.3; }
.stat .s { font-size: 12.5px; color: var(--ink-soft); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 99px; font-size: 12.5px; font-weight: 600; border: 1px solid currentColor; margin: 2px 4px 2px 0; font-family: var(--sans); }
.el-Mộc { color: var(--moc); } .el-Hỏa { color: var(--hoa); } .el-Thổ { color: var(--tho); } .el-Kim { color: var(--kim); } .el-Thủy { color: var(--thuy); }
.bg-Mộc { background: var(--moc); } .bg-Hỏa { background: var(--hoa); } .bg-Thổ { background: var(--tho); } .bg-Kim { background: var(--kim); } .bg-Thủy { background: var(--thuy); }

.chart-wrap { overflow-x: auto; }
table.chart { width: 100%; border-collapse: collapse; min-width: 520px; font-size: 14px; font-variant-numeric: tabular-nums; }
table.chart th, table.chart td { border: 1px solid var(--line); padding: 8px 6px; text-align: center; vertical-align: middle; }
table.chart th.rowh { text-align: left; font-weight: 600; color: var(--ink-soft); font-size: 12.5px; width: 104px; background: var(--bg); }
table.chart thead th { font-family: var(--serif); font-size: 16px; background: var(--bg); }
table.chart td.day { background: var(--accent-soft); }
.gz { font-family: var(--serif); font-size: 26px; font-weight: 700; line-height: 1.15; }
.small { font-size: 12px; color: var(--ink-soft); }
.hidden-list { display: flex; flex-direction: column; gap: 2px; font-size: 13px; }

.bars { display: grid; gap: 9px; }
.bar { display: grid; grid-template-columns: 48px minmax(0, 1fr) 92px; align-items: center; gap: 10px; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.bar .track { height: 10px; background: var(--bg); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.bar .fill { height: 100%; border-radius: 99px; }
.bar .tag { font-size: 12px; color: var(--ink-soft); text-align: right; }

.grid2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; margin-top: 16px; }
.grid2 > * { min-width: 0; }
@media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }

.section { margin-top: 16px; }
.section h3 { font-family: var(--serif); font-size: 20px; margin: 0 0 2px; }
.section .sum { color: var(--accent); font-weight: 600; margin: 0 0 12px; }
.section p { margin: 0 0 9px; max-width: 78ch; }
.section ul { margin: 6px 0 0; padding-left: 18px; max-width: 80ch; }
.section li { margin-bottom: 5px; }
.src { font-size: 12px; color: var(--ink-soft); font-style: italic; margin-top: 10px; }
.toc { display: flex; gap: 6px; flex-wrap: wrap; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; margin-top: 12px; }
.toc a { font-size: 13px; text-decoration: none; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--ink); background: var(--surface); }
.toc a:hover { border-color: var(--accent); color: var(--accent); }

.luck { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; }
.years { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.luck .cell, .years .cell { border: 1px solid var(--line); border-radius: 8px; padding: 8px; text-align: center; background: var(--surface); font-variant-numeric: tabular-nums; position: relative; }
.luck .cell:hover, .years .cell:hover { border-color: var(--accent); }
.cell.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cell.cur::after { content: 'hiện tại'; position: absolute; top: -8px; right: 6px; font-size: 10px; line-height: 16px; background: var(--seal); color: var(--seal-ink); padding: 0 6px; border-radius: 99px; }
.luck .cell .gz, .years .cell .gz { font-size: 18px; }
.rate { font-size: 12px; font-weight: 700; border-radius: 99px; padding: 1px 8px; display: inline-block; margin-top: 4px; }
.r-Rấttốt { background: var(--r5-bg); color: var(--r5-fg); } .r-Tốt { background: var(--r4-bg); color: var(--r4-fg); } .r-Bìnhhoà { background: var(--r3-bg); color: var(--r3-fg); } .r-Kém { background: var(--r2-bg); color: var(--r2-fg); } .r-Xấu { background: var(--r1-bg); color: var(--r1-fg); }
.detail { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 10px; font-size: 14px; }
.shensha { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.shensha .item { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--bg); }
.shensha .item b { font-family: var(--serif); }
.good { color: var(--good); } .bad { color: var(--bad); }
.md h2 { font-family: var(--serif); font-size: 19px; margin: 18px 0 6px; }
.md h3 { font-size: 16px; margin: 14px 0 4px; }
.md p { margin: 0 0 10px; max-width: 78ch; }
.footer { margin-top: 40px; color: var(--ink-soft); font-size: 12.5px; text-align: center; }
.preview-img { max-width: 100%; border-radius: 8px; border: 1px solid var(--line); display: block; }
details.raw summary { cursor: pointer; color: var(--ink-soft); font-size: 13px; }
@media (max-width: 640px) {
  .toc { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .toc a { white-space: nowrap; }
  .brand p { display: none; }
  table.chart { min-width: 0; font-size: 12.5px; }
  table.chart th.rowh { width: 60px; font-size: 11px; padding: 6px 4px; }
  table.chart td { padding: 6px 3px; }
  .gz { font-size: 21px; }
  .card { padding: 16px; }
}

/* Bàn lá số Tử Vi 12 cung */
.tv-board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: minmax(150px, auto); gap: 6px; }
.tv-cell { border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--bg); display: flex; flex-direction: column; gap: 4px; min-width: 0; font-size: 12.5px; line-height: 1.4; }
.tv-cur { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.tv-head { display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
.tv-head strong { font-family: var(--serif); font-size: 13.5px; }
.tv-major { display: flex; flex-wrap: wrap; gap: 2px 8px; font-weight: 700; font-size: 13.5px; }
.tv-major sup { font-size: 9.5px; margin-left: 1px; color: var(--ink-soft); }
.tv-minor { display: flex; flex-wrap: wrap; gap: 0 6px; font-size: 11.5px; }
.tv-hoa { text-decoration: underline; text-underline-offset: 2px; font-weight: 700; color: var(--accent); }
.tv-yearly { font-size: 11px; color: var(--gold); font-style: italic; }
.tv-foot { margin-top: auto; display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.tv-tag { font-size: 10.5px; font-weight: 700; padding: 0 6px; border-radius: 99px; background: var(--accent); color: var(--surface); }
.tv-tag-luu { background: var(--seal); color: var(--seal-ink); }
.tv-center { grid-row: 2 / span 2; grid-column: 2 / span 2; border: 1px dashed var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; justify-content: center; }
.tv-center dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 6px 0 0; font-size: 13.5px; }
.tv-center dt { color: var(--ink-soft); }
.tv-center dd { margin: 0; font-weight: 600; }
@media (max-width: 760px) {
  .tv-board { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: auto; }
  .tv-cell { grid-row: auto !important; grid-column: auto !important; }
  .tv-center { grid-row: 1; grid-column: 1 / -1; }
}

/* Ô nhập văn bản */
.paste { width: 100%; min-height: 320px; resize: vertical; font: 13px/1.55 ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.paste:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.fmt { font-size: 13px; color: var(--ink-soft); }
.fmt code { font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }

/* ---- Tóm tắt dễ hiểu ---- */
.plain-head { margin-top: 16px; border-left: 4px solid var(--seal); }
.plain-lead { font-family: var(--serif); font-size: clamp(17px, 2.4vw, 20px); line-height: 1.5; margin: 6px 0 8px; max-width: 75ch; }
.plain-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 14px; margin-top: 14px; }
.pcard { display: flex; flex-direction: column; gap: 6px; border-top: 3px solid var(--line); }
.pcard.lv-good { border-top-color: var(--good); }
.pcard.lv-mid { border-top-color: var(--gold); }
.pcard.lv-bad { border-top-color: var(--bad); }
.pcard header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.pcard h3 { font-family: var(--serif); font-size: 18px; margin: 0; }
.pcard .rate { margin-top: 0; }
.plines { margin: 4px 0 0; padding-left: 18px; font-size: 15px; line-height: 1.6; }
.plines li { margin-bottom: 6px; }
.ptips { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; font-size: 14px; }
.ptips ul { margin: 2px 0 0; padding-left: 18px; }
.ptl { font-weight: 700; font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); }
.why { margin-top: auto; font-size: 13px; color: var(--ink-soft); border-top: 1px dashed var(--line); padding-top: 8px; }
.why summary { cursor: pointer; font-weight: 600; }
.why p, .why ul { margin: 6px 0 0; }
.detail .why { margin-top: 8px; }
.deep-head { margin-top: 32px; border-top: 2px solid var(--line); padding-top: 16px; }
.deep-head h2 { font-family: var(--serif); font-size: 22px; margin: 0 0 4px; }
.toc a.toc-main { background: var(--accent); color: var(--surface); border-color: var(--accent); }

/* ---- Thuật ngữ bấm để xem ---- */
.term { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: help; text-decoration: underline dotted var(--accent); text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
.term:hover, .term.open { color: var(--accent); }
.term:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 2px; }
.term-pop { display: block; margin: 6px 0; padding: 8px 10px; border-radius: 8px; background: var(--accent-soft); color: var(--ink); font-size: 13.5px; font-weight: 400; line-height: 1.5; text-transform: none; letter-spacing: 0; font-family: var(--sans); white-space: normal; text-align: left; }
.glossary { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 10px 18px; margin: 12px 0 0; }
.glossary dt { font-weight: 700; font-family: var(--serif); }
.glossary dd { margin: 2px 0 0; font-size: 14px; color: var(--ink-soft); }

/* ---- Hướng dẫn lấy văn bản ---- */
.steps a { color: var(--accent); font-weight: 600; }
.prompt-box { margin-top: 16px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--bg); }
.prompt-box summary { cursor: pointer; margin-top: 6px; }
.prompt-pre { margin: 8px 0 0; max-height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-word; font: 12px/1.5 ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; color: var(--ink); }

Bng, ngo\xE0i s\xE1ng trong trong; g\u1EB7p kim c\xE0ng s\xE1ng, \u201Cho\u1EA3 \u0111a t\xE0i th\u1ECBnh, m\u1ED9c tr\u1ECDng th\xEA vinh\u201D. K\u1EF5 th\u1ED5 l\xE0m \u0111\u1EE5c, thu\u1EF7 qu\xE1 nhi\u1EC1u tr\xE0n lan.",\u0110\u00F4ng:"Thu\u1EF7 m\xF9a \u0110\xF4ng (V\u01B0\u1EE3ng): chuy\xEAn quy\u1EC1n n\u1EAFm l\u1EC7nh, g\u1EB7p ho\u1EA3 th\xEAm \u1EA5m, m\u1ED9c th\u1ECBnh h\u1EEFu t\xECnh, g\u1EB7p th\u1ED5 kh\xF4ng tr\xE0n. K\u1EF5 kim nhi\u1EC1u (v\xF4 ngh\u0129a), th\u1ED5 nhi\u1EC1u (v\xF4 \xE2n)."},H\u1ECFa:{Xu\u00E2n:"Ho\u1EA3 m\xF9a Xu\xE2n (T\u01B0\u1EDBng): m\u1EB9 v\u01B0\u1EE3ng con t\u01B0\u1EDBng; th\u1EA5y kim c\xF3 th\u1EC3 l\xE0m vi\u1EC7c l\u1EDBn; m\u1ED9c \xEDt th\xEC \u0111\u01B0\u1EE3c sinh ph\xF9; thu\u1EF7 v\u1EEBa ph\u1EA3i th\xE0nh \u201Cthu\u1EF7 ho\u1EA3 k\xFD t\u1EBF\u201D. K\u1EF5 ho\u1EA3 th\u1ECBnh qu\xE1 kh\xF4, th\u1ED5 nhi\u1EC1u l\xE0m t\u1ED1i.",H\u1EA1:"Ho\u1EA3 m\xF9a H\u1EA1 (V\u01B0\u1EE3ng): g\u1EB7p kim th\xEC l\u01B0\u01A1ng thi\u1EC7n, \u0111\u01B0\u1EE3c th\u1ED5 th\xE0nh gi\xE1 s\u1EAFc (c\u1EA7n thu\u1EF7 k\xE8m). K\u1EF5 th\xEAm ho\u1EA3 c\xE0ng nguy, g\u1EB7p m\u1ED9c th\xEC b\u1EC7nh ho\u1EA1n.",Thu:"Ho\u1EA3 m\xF9a Thu (T\xF9): t\xEDnh d\u1EEBng, h\xECnh ng\u01B0ng ngh\u1EC9; tr\xF9ng \u0111i\u1EC7p g\u1EB7p ho\u1EA3 m\xE0 s\xE1ng, g\u1EB7p m\u1ED9c \u0111\u01B0\u1EE3c sinh. K\u1EF5 th\u1ED5 n\u1EB7ng che s\xE1ng, thu\u1EF7 kh\u1EAFc d\u1EADp t\u1EAFt, kim nhi\u1EC1u t\u1ED5n h\xECnh.",\u0110\u00F4ng:"Ho\u1EA3 m\xF9a \u0110\xF4ng (T\u1EED): h\xECnh tuy\u1EC7t, c\xF3 m\u1ED9c sinh th\xEC \u0111\u01B0\u1EE3c c\u1EE9u; c\xF3 th\u1ED5 ch\u1EBF thu\u1EF7 l\xE0 vinh. K\u1EF5 kim kh\xF4ng g\xE1nh n\u1ED5i T\xE0i, thu\u1EF7 kh\u1EAFc g\u1EB7p tai \u01B0\u01A1ng."},Th\u1ED5:{Xu\u00E2n:"Th\u1ED5 m\xF9a Xu\xE2n (T\u1EED): th\u1EBF h\u01B0 nh\u01B0\u1EE3c, m\u1EEBng ho\u1EA3 sinh ph\xF9, th\u1ED5 t\u1EF7 tr\u1EE3; kim ch\u1EBF m\u1ED9c th\xE0nh t\u01B0\u1EDDng v\xE1ch. K\u1EF5 m\u1ED9c th\xE1i qu\xE1, thu\u1EF7 tr\xE0n lan.",H\u1EA1:"Th\u1ED5 m\xF9a H\u1EA1 (T\u01B0\u1EDBng): th\u1EBF t\xE1o kh\xF4, g\u1EB7p thu\u1EF7 th\u1ECBnh th\xEC t\u01B0 nhu\u1EADn th\xE0nh c\xF4ng, c\xF3 th\xEAm kim sinh thu\u1EF7 c\xE0ng t\u1ED1t. K\u1EF5 ho\u1EA3 v\u01B0\u1EE3ng l\xE0m ch\xE1y kh\xE9t, th\u1ED5 nhi\u1EC1u b\u1EBF t\u1EAFc.",Thu:"Th\u1ED5 m\xF9a Thu (H\u01B0u): con v\u01B0\u1EE3ng m\u1EB9 suy, kh\xF4ng ng\u1EA1i ho\u1EA3 tr\u1ECDng; th\xEDch m\u1ED9c th\u1ECBnh ch\u1EBF ph\u1EE5c thu\u1EA7n l\u01B0\u01A1ng. K\u1EF5 kim nhi\u1EC1u hao kh\xED, thu\u1EF7 tr\xE0n kh\xF4ng c\xF2n t\u01B0\u1EDDng v\xE1ch.",\u0110\u00F4ng:"Th\u1ED5 m\xF9a \u0110\xF4ng (T\xF9): ngo\xE0i l\u1EA1nh trong \u1EA5m; m\u1ED9c \u1EA5m ho\u1EA3 \u1EA5m th\xEC \u0111\xF4ng ho\xE1 xu\xE2n, th\xEAm th\u1ED5 tr\u1EE3 c\xE0ng \u0111\u1EB9p. K\u1EF5 kim thu\u1EF7 h\xE0n l\u1EA1nh l\xE0m th\u1ED5 \u0111\xF3ng b\u0103ng."}},Mt=[{pillar:"Tr\u1EE5 n\u0103m",age:"1\u201318 tu\u1ED5i",people:"t\u1ED5 ti\xEAn, \xF4ng b\xE0, cha m\u1EB9, ng\u01B0\u1EDDi ngo\xE0i, b\u1EC1 tr\xEAn",body:"ch\xE2n, gi\xF2, t\u1EE9 chi",place:"ph\u01B0\u01A1ng xa, n\u01A1i g\u1ED1c g\xE1c"},{pillar:"Tr\u1EE5 th\xE1ng",age:"18\u201335 tu\u1ED5i",people:"cha m\u1EB9, anh ch\u1ECB em, \u0111\u1ED3ng h\u1ECDc, \u0111\u1ED3ng nghi\u1EC7p, l\xE3nh \u0111\u1EA1o",body:"g\xE1y, vai, l\u01B0ng",place:"qu\xEA qu\xE1n, s\u1EA3n nghi\u1EC7p t\u1ED5 ti\xEAn, \u0111\u01A1n v\u1ECB c\xF4ng t\xE1c"},{pillar:"Tr\u1EE5 ng\xE0y",age:"35\u201355 tu\u1ED5i",people:"b\u1EA3n th\xE2n (can) & v\u1EE3/ch\u1ED3ng (chi \u2013 cung phu th\xEA)",body:"ng\u0169 t\u1EA1ng l\u1EE5c ph\u1EE7, tim, n\xE3o",place:"nh\xE0 \u1EDF hi\u1EC7n t\u1EA1i, ph\xF2ng ng\u1EE7, t\xE0i s\u1EA3n ri\xEAng"},{pillar:"Tr\u1EE5 gi\u1EDD",age:"sau 55 tu\u1ED5i",people:"con c\xE1i, h\u1ECDc tr\xF2, c\u1EA5p d\u01B0\u1EDBi, b\u1EA1n tr\u1EBB",body:"\u0111\u1EA7u, m\u1EB7t, tay, m\u1EAFt, mi\u1EC7ng, c\u01A1 quan b\xE0i ti\u1EBFt",place:"c\u1EEDa nh\xE0, xe c\u1ED9, qu\u1EA7n \xE1o, \u0111\u1ED3 d\xF9ng"}],St={"Ch\xEDnh Quan c\xE1ch":"Ng\u01B0\u1EDDi \u0111oan ch\xEDnh, tr\u1ECDng danh d\u1EF1, h\u1EE3p con \u0111\u01B0\u1EDDng c\xF4ng quy\u1EC1n \u2013 t\u1ED5 ch\u1EE9c. Qu\xFD \u1EDF Quan thanh (kh\xF4ng S\xE1t h\u1ED7n), c\xF3 T\xE0i sinh, \u1EA4n h\u1ED9; s\u1EE3 Th\u01B0\u01A1ng Quan ph\xE1, h\xECnh xung.","Th\u1EA5t S\xE1t c\xE1ch":"C\xF3 kh\xED ph\xE1ch, ch\xED l\u1EDBn, h\u1EE3p ngh\u1EC1 c\u1EA7n quy\u1EC1n l\u1EF1c \u2013 k\u1EF7 lu\u1EADt. S\xE1t c\u1EA7n ch\u1EBF (Th\u1EF1c th\u1EA7n) ho\u1EB7c ho\xE1 (\u1EA4n); c\xF3 ch\u1EBF ho\xE1 th\xEC \u201CS\xE1t bi\u1EBFn th\xE0nh quy\u1EC1n\u201D, kh\xF4ng ch\u1EBF th\xEC S\xE1t c\xF4ng th\xE2n.","Ch\xEDnh T\xE0i c\xE1ch":"Th\u1EF1c t\u1EBF, c\u1EA7n m\u1EABn, gi\u1EEF c\u1EE7a; gi\xE0u nh\u1EDD t\xEDch lu\u1EF9 \u0111\u1EC1u \u0111\u1EB7n. Th\xE2n c\u01B0\u1EDDng g\xE1nh \u0111\u01B0\u1EE3c T\xE0i l\xE0 ph\xFAc; s\u1EE3 T\u1EF7 Ki\u1EBFp tranh \u0111o\u1EA1t.","Thi\xEAn T\xE0i c\xE1ch":"Nh\u1EA1y b\xE9n, h\xE0o ph\xF3ng, gi\u1ECFi n\u1EAFm th\u1EDDi c\u01A1 \u2013 t\xE0i \u0111\u1EBFn t\u1EEB kinh doanh, \u0111\u1EA7u t\u01B0. Th\xE2n v\u01B0\u1EE3ng T\xE0i v\u01B0\u1EE3ng th\xEC \u0111\u1EA1i ph\xFA; th\xE2n nh\u01B0\u1EE3c th\xEC t\xE0i nhi\u1EC1u m\xE0 kh\xF3 gi\u1EEF.","Ch\xEDnh \u1EA4n c\xE1ch":"H\u1ECDc v\u1EA5n, nh\xE2n h\u1EADu, \u0111\u01B0\u1EE3c che ch\u1EDF; h\u1EE3p gi\xE1o d\u1EE5c \u2013 v\u0103n ho\xE1 \u2013 h\xE0nh ch\xEDnh. \u1EA4n khinh h\u1EF7 Quan S\xE1t sinh; \u1EA4n tr\u1ECDng h\u1EF7 T\xE0i ch\u1EBF; s\u1EE3 T\xE0i ph\xE1 \u1EA4n khi th\xE2n nh\u01B0\u1EE3c.","Thi\xEAn \u1EA4n c\xE1ch":"Th\xF4ng minh \u0111\u1ED9c \u0111\xE1o, gi\u1ECFi chuy\xEAn m\xF4n \u0111\u1EB7c th\xF9, huy\u1EC1n h\u1ECDc, y thu\u1EADt, k\u1EF9 thu\u1EADt. S\u1EE3 Ki\xEAu \u0111o\u1EA1t Th\u1EF1c; c\xF3 T\xE0i ch\u1EBF Ki\xEAu th\xEC th\xE0nh.","Th\u1EF1c Th\u1EA7n c\xE1ch":"T\xE0i hoa, ph\xFAc h\u1EADu, s\u1ED1ng an nh\xE0n h\u01B0\u1EDFng th\u1EE5; Th\u1EF1c sinh T\xE0i l\xE0 ph\xFA, Th\u1EF1c ch\u1EBF S\xE1t l\xE0 qu\xFD. S\u1EE3 Ki\xEAu th\u1EA7n \u0111o\u1EA1t Th\u1EF1c.","Th\u01B0\u01A1ng Quan c\xE1ch":"Th\xF4ng minh, s\xE1ng t\u1EA1o, gi\u1ECFi bi\u1EC3u \u0111\u1EA1t, kh\xF3 ch\u1ECBu g\xF2 b\xF3. Th\u01B0\u01A1ng quan sinh T\xE0i th\xEC ph\xFA, Th\u01B0\u01A1ng quan b\u1ED9i \u1EA4n th\xEC qu\xFD; k\u1EF5 Th\u01B0\u01A1ng quan ki\u1EBFn Quan.","Ki\u1EBFn L\u1ED9c c\xE1ch":"L\u1ED9c \u1EDF nguy\u1EC7t l\u1EC7nh \u2013 th\xE2n c\xF3 g\u1ED1c v\u1EEFng, t\u1EF1 l\u1EADp th\xE2n, \xEDt nh\u1EDD t\u1ED5 nghi\u1EC7p. C\u1EA7n T\xE0i Quan \u0111\u1EC3 d\u1EE5ng (L\u1ED9c ki\u1EBFp d\u1EE5ng Quan/T\xE0i); kh\xF4ng c\xF3 T\xE0i Quan th\xEC b\xF4n ba.","Ki\u1EBFn L\u1ED9c (Nguy\u1EC7t Ki\u1EBFp) c\xE1ch":"Nguy\u1EC7t ki\u1EBFp \u2013 th\xE2n v\u01B0\u1EE3ng t\u1EF1 l\u1EADp, c\u1EA7n T\xE0i Quan ho\u1EB7c Th\u1EF1c Th\u01B0\u01A1ng \u0111\u1EC3 d\u1EE5ng; T\u1EF7 Ki\u1EBFp nhi\u1EC1u d\u1EC5 hao t\xE0i.","Nguy\u1EC7t Ki\u1EBFp c\xE1ch":"Ki\u1EBFp t\xE0i n\u1EAFm l\u1EC7nh \u2013 c\u1EA1nh tranh m\u1EA1nh, c\u1EA7n Quan S\xE1t ch\u1EBF Ki\u1EBFp ho\u1EB7c Th\u1EF1c Th\u01B0\u01A1ng ho\xE1 Ki\u1EBFp.","D\u01B0\u01A1ng Nh\u1EADn c\xE1ch":"C\u01B0\u01A1ng m\xE3nh, d\xE1m l\xE0m, h\u1EE3p v\xF5 ch\u1EE9c \u2013 quy\u1EC1n l\u1EF1c. Nh\u1EADn c\u1EA7n S\xE1t ch\u1EBF (Nh\u1EADn S\xE1t t\u01B0\u01A1ng t\u1EBF) m\u1EDBi th\xE0nh \u0111\u1EA1i kh\xED; kh\xF4ng ch\u1EBF th\xEC d\u1EC5 hung hi\u1EC3m, ph\xE1 t\xE0i."};var Ct=["Tr\xEDch Thi\xEAn T\u1EE7y (Kinh \u0110\u1EA1o) \u2013 Nh\u1EADm Thi\u1EBFt Ti\u1EC1u b\xECnh ch\xFA","T\u1EED B\xECnh Ch\xE2n Thuy\xEAn \u2013 T\u1EEB Nh\u1EA1c Ng\xF4 b\xECnh ch\xFA (k\xE8m B\xE1t T\u1EF1 D\u1EE5ng Th\u1EA7n \u0110\u1EC1 Y\u1EBFu, T\u1EED B\xECnh B\u1EC7nh Nguy\xEAn)","Thi\xEAn L\xFD M\u1EC7nh C\u1EA3o \u2013 Vi Thi\xEAn L\xFD","M\u1EC7nh L\xFD Huy\u1EC1n C\u01A1 Tham B\xED","Manh ph\xE1i s\u01A1 \u2013 trung \u2013 cao c\u1EA5p m\u1EC7nh l\xFD h\u1ECDc","L\u1EE5c Th\xE2n cao c\u1EA5p di\u1EC7n th\u1EE5","\u0110\u1ED5i V\u1EADn Cho Ng\u01B0\u1EDDi M\u1EC7nh Khuy\u1EBFt (Xu\xE2n H\u1EA1, Thu \u0110\xF4ng) \u2013 L\xFD C\u01B0 Minh","Kh\xED th\u1EBF l\u01B0u th\xF4ng"];var qt={Gi\u00E1p:{"1":{thuongLy:"Gi\xE1p sinh th\xE1ng D\u1EA7n, Nh\u1EADt nguy\xEAn \u0111\u01B0\u1EE3c L\u1ED9c; kh\xED h\xE0n l\u1EA1nh c\xF2n l\u1EA1i ch\u01B0a h\u1EBFt, h\u1EF7 B\xEDnh l\xE0m \u1EA5m. Th\xE2n c\u01B0\u1EDDng, chuy\xEAn l\u1EA5y B\xEDnh h\u1ECFa \u0111i\u1EC1u h\u1EADu ki\xEAm ti\u1EBFt t\xFA, l\xE0 ch\xE2n th\u1EA7n \u0111\u1EAFc d\u1EE5ng, ph\xFA qu\xFD kh\xF4ng nh\u1EB9.",bienLy:["N\u1EBFu h\u1ECFa qu\xE1 nhi\u1EC1u, ti\u1EBFt nh\u01B0\u1EE3c Nh\u1EADt nguy\xEAn, Th\u1EF1c nhi\u1EC1u th\xE2n nh\u01B0\u1EE3c, l\u1EA1i c\u1EA7n th\u1EA5y Qu\xFD, d\u1EE5ng \u1EA4n ch\u1EBF Th\u1EF1c sinh th\xE2n.","T\xE0i \u0111a th\xE2n nh\u01B0\u1EE3c, chuy\xEAn th\u1EE7 d\u1EE5ng l\u1EC7nh Gi\xE1p T\u1EC9 \u0111\u1EC3 tr\u1EE3, ph\xFA nhi\u1EC1u qu\xFD \xEDt.","Nguy\xEAn c\u1EE5c \u1EA4n nhi\u1EC1u, l\xE0 th\u1EE7y phi\u1EBFm m\u1ED9c ph\xF9, ch\u1EBFt kh\xF4ng c\xF3 \xE1o quan; l\u1EA1i h\u1EF7 M\u1EADu \u0111\u1EBFn ng\u0103n th\u1EE7y, B\xEDnh \u0111\u1EBFn gi\xFAp M\u1EADu, d\u1EE5ng T\xE0i ph\xE1 \u1EA4n, m\u1EDBi kh\u1ECFi hung nguy.","Th\xE1ng D\u1EA7n c\xF3 Gi\xE1p B\xEDnh M\u1EADu \u0111\u1EC1u l\xE0 v\u01B0\u1EE3ng kh\xED, ch\u1ECF c\xF3 l\u1EA5y m\u1ED9t l\xE0m d\u1EE5ng, c\u0169ng c\xF3 danh l\u1EE3i.","Xu\xE2n m\u1ED9c n\u1EAFm l\u1EC7nh, l\xFD l\u1EBD l\xE0 quy\u1EBFtkh\xF4ng c\xF3 T\xF2ng C\u01B0\u1EDDng; 10 can c\xF2n l\u1EA1i, ph\xE0m sinh n\u1EAFm v\u01B0\u1EE3ng l\u1EC7nh, d\u1EABu c\xF3 kh\u1EAFc ti\u1EBFt giao gia, Nh\u1EADt nguy\xEAn b\u1ECB c\xF4 l\u1EADp, c\u0169ng kh\xF4ng l\u1EA5y lu\u1EADn T\xF2ng C\u01B0\u1EDDng, \u0111\u1EB7c bi\u1EC7t can d\u01B0\u01A1ng l\xE0 \u0111\xFAng.","T\xF2ng m\xE0 kh\xF3 t\xF2ng, l\xE0 k\u1EBB b\u1EA7n ti\u1EC7n."],viDu:["1. M\u1EC7nh Tr\u1EA7n T\u1EBF \u0110\u01B0\u1EDDng: Canh M\u1EADu Gi\xE1p B\xEDnh D\u1EA7n D\u1EA7n T\xFD D\u1EA7n \u0110\u1EA7u Xu\xE2n l\u1EA5y B\xEDnh h\u1ECFa l\xE0 l\u1EA5y \u0111\xFAng d\u1EE5ng th\u1EA7n, m\u1EC7nh n\xE0y c\xF3 \u0111\u1ECBa chi ba D\u1EA7n, th\xE2n ch\u1EE7 c\u01B0\u1EDDng v\u01B0\u1EE3ng, n\xEAn l\u1EA5y B\xEDnh h\u1ECFa ti\u1EBFt t\xFA; h\xE0n l\u1EA1nh c\xF2n d\u01B0 ch\u01B0a h\u1EBFt, c\u0169ng ph\u1EA3i th\u1EA5y B\xEDnh l\xE0m \u1EA5m \xE1p; trung h\xE0nh h\u1ECFa \u0111\u1ECBa, m\u1ED9t th\u1EDDi hi\u1EC3n h\xE1ch.","2. M\u1EC7nh Tr\u1EA1ng nguy\xEAn: Gi\xE1p B\xEDnh Gi\xE1p \u1EA4t T\xFD D\u1EA7n Tu\u1EA5t H\u1EE3i Can n\u0103m Gi\xE1p T\u1EC9, can gi\u1EDD \u1EA4t Ki\u1EBFp, d\u01B0\u1EDBc g\u1ED1c c\xF3 D\u1EA7n H\u1EE3i, m\u1ED9c l\u1EA5y th\xE0nh r\u1EEBng, t\u1EA5t th\u1EE7 nguy\u1EC7t l\u1EC7nh B\xEDnh h\u1ECFa l\xE0m d\u1EE5ng, g\u1ED1c B\xEDnh \u1EDF D\u1EA7n Tu\u1EA5t, ch\u1ED7 n\xE0y l\xE0 ph\xFA qu\xFD kh\xF4ng nh\u1EB9."]},"2":{thuongLy:"Gi\xE1p sinh th\xE1ng M\xE3o, Nh\u1EADt nguy\xEAn D\u01B0\u01A1ng Nh\u1EADn, h\xE0n l\u1EA1nh \u0111\xE3 lui, kh\xF4ng c\u1EA7n \u0111\u1EBFn B\xEDnh; Th\xE2n c\u01B0\u1EDDng d\u1EE5ng B\xEDnh, ph\u1EA3i c\xF3 ph\u1ED1i Qu\xFD; c\xF3 B\xEDnh kh\xF4ng c\xF3 Qu\xFD, Gi\xE1p s\u1EE3 b\u1ECB ti\u1EBFt qu\xE1 n\u1EB7ng; c\xF3 Qu\xFD kh\xF4ng c\xF3 B\xEDnh, Gi\xE1p qu\xE1 ngoan c\u01B0\u1EDDng; Th\u1EE7y H\u1ECFa k\xFD t\u1EBF, m\u1EDBi h\u1EE9a ph\xFA qu\xFD.",bienLy:["Th\xE2n c\u01B0\u1EDDng, d\u1EE5ng Canh kim ch\u1EBF, d\u1EE5ng M\u1EADu th\u1ED5 l\xE0 ph\u1EE5, l\xE0 T\xE0i sinh S\xE1t, t\u1EA5t nhi\xEAn l\xE0 ph\xFA qu\xFD.","D\u1EE5ng \u0110inh h\u1ECFa ti\u1EBFt c\u01B0\u1EDDng th\xE2n, g\u1ECDi l\xE0 M\u1ED9c H\u1ECFa th\xF4ng minh, v\u0103n h\u1ECDc nh\u01B0 th\u1EA7n.","Canh Gi\xE1p l\u01B0\u1EE1ng c\u01B0\u1EDDng, can th\u1EA5y \u0110inh h\u1ECFa, g\u1ECDi l\xE0 Th\u01B0\u01A1ng quan gi\xE1 S\xE1t, ch\u1EE9c cao quy\u1EC1n tr\u1ECDng.","N\u1EBFu kh\xF4ng c\xF3 th\xE2n c\u01B0\u1EDDng \u0111\u1ECBch s\xE1t, xu\xE2n m\u1ED9c t\u1ED1i k\u1ECB th\u1EA5y, b\u1EDFi v\xEC xu\xE2n m\u1ED9c l\xE0 Ho\u1EA1t m\u1ED9c ( m\u1ED9c s\u1ED1ng), t\u1ED1i k\ p, B\xEDnh t\xE0ng \u1EDF gi\u1EDD, l\xE0 H\xE0n m\u1ED9c h\u01B0\u1EDBng d\u01B0\u01A1ng, c\xE0ng h\u1EF7 v\u1EADn ph\u1ED1i m\u1ED9c h\u1ECFa, t\u1EA5t vui v\u1EBD m\xE0 h\u01B0\u1EDBng vinh v\u1EADy.","2. M\u1EC7nh b\u1EA7n ti\u1EC7n: B\xEDnh T\xE2n \u1EA4t B\xEDnh T\xFD S\u1EEDu T\u1ECB T\xFD D\u1EE5ng B\xEDnh g\u1EB7p T\xE2n h\u1EE3p, d\u1EE5ng T\u1ECB, T\u1ECB D\u1EADu S\u1EEDu tam h\u1EE3p kim c\u1EE5c, v\u1EADn nh\u1EADp \u0110\xF4ng Nam, b\u1EA5t qu\xE1 ch\u1EC9 l\xE0 gi\u1EDBi h\xE0n nho, nguy\xEAn nh\xE2n l\xE0 do nguy\xEAn m\u1EC7nh th\u1EA5t c\xE1ch m\u1EA5t d\u1EE5ng."]}},B\u00EDnh:{"1":{thuongLy:"B\xEDnh sinh th\xE1ng D\u1EA7n, \u1EA4n tinh n\u1EAFm l\u1EC7nh; B\xEDnh \u0111\u01B0\u1EE3c tr\u01B0\u1EDDng sinh, kh\xED t\u1EF1 sinh v\u01B0\u1EE3ng. Th\xE2n c\u01B0\u1EDDng h\u1EF7 Nh\xE2m t\u01B0\u01A1ng t\u1EBF ( h\u1ED7 tr\u1EE3 l\u1EABn nhau); duy ch\u1EC9 c\xF3 \u1EA4n tinh n\u1EAFm quy\u1EC1n, c\xF3 th\u1EC3 h\xF3a Nh\xE2m S\xE1t, cho n\xEAn l\u1EA1i c\u1EA7n th\u1EA5y Canh, lo\u1EA1i m\u1ED9c c\xF2n th\u1EE7y; th\xE2n c\u01B0\u1EDDng th\u1EA5y Nh\xE2m Canh c\xF9ng th\u1EA5u, l\xE0 T\xE0i t\u01B0 nh\u01B0\u1EE3c S\xE1t, t\u1EA5t nhi\xEAn l\xE0 ph\xFA qu\xFD; Nh\xE2m th\u1EA5u Canh t\xE0ng, kh\xE1c \u0111\u01B0\u1EDDng \u0111\u1EBFn qu\xFD, cho n\xEAn ph\xFA nhi\u1EC1u m\xE0 qu\xFD \xEDt.",bienLy:["Nguy\xEAn c\u1EE5c c\xF3 m\u1ED9c nhi\u1EC1u th\xEC h\u1ECFa b\u1EBF t\u1EAFc, chuy\xEAn d\u1EE5ng Canh T\xE0i ph\xE1 \u1EA4n, c\u0169ng c\xF3 th\u1EC3 d\u1EABn \u0111\u1EBFn qu\xFD.","B\xEDnh h\u1ECFa t\u1ED1i k\u1ECB M\u1EADu K\u1EF7 v\xEC l\xE0m m\u1EDD s\xE1ng l\xE0m b\u1EBF t\u1EAFc Nh\xE2m, B\xEDnh c\u1EF1c v\u01B0\u1EE3ng m\xE0 d\u1EE5ng M\u1EADu K\u1EF7 ti\u1EBFt, ch\u1EC9 c\xF3 ph\xFA m\xE0 th\xF4i.","N\u1EBFu th\xE2n nh\u01B0\u1EE3c, n\xEAn d\u1EE5ng Gi\xE1p \u1EA4n, l\xE0 ch\xE2n th\u1EA7n \u0111\u1EAFc d\u1EE5ng, t\u1EA5t nhi\xEAn ph\xFA qu\xFD; nh\u01B0ng v\u1EABn ph\u1EA3i th\u1EA5y Nh\xE2m m\u1EDBi l\xE0 th\u01B0\u1EE3ng c\xE1ch; Gi\xE1p m\u \u1EC7t l\u1EC7nh \u1EA4t \u1EA4n, l\xE0 ch\xEDnh kh\xED \u1EA4n tinh, ph\xFA qu\xFD kh\xF4ng nh\u1EB9; n\u1EBFu l\u1EA5y B\xEDnh \u0110inh L\u1ED9c Nh\u1EADn l\xE0 tr\u1EE3 gi\xFAp, \u0110\u1ECBch S\xE1t th\xEC qu\xFD, ph\xE2n T\xE0i ch\u1EE7 ph\xFA, qu\u1EA3n l\xFD to\xE0n c\u1EE5c ph\u1ED1i h\u1EE3p m\xE0 \u0111\u1ECBnh."],viDu:["1. M\u1EC7nh t\u1EA1o Ho\xE0ng Phu: Canh K\u1EF7 B\xEDnh M\u1EADu Th\xECn M\xE3o Th\xE2n Tu\u1EA5t Th\u1EF1c Th\u01B0\u01A1ng c\xF9ng th\u1EA5y, ti\u1EBFt kh\xED l\xE0 h\u1EA1i, th\u1EE7 nguy\u1EC7t l\u1EC7nh M\xE3o m\u1ED9c vi d\u1EE5ng. V\u1EADn nh\u1EADp Nam ph\u01B0\u01A1ng, nh\u1EADn ch\u1EE9c T\u1ED5ng tr\u01B0\u1EDFng Ngo\u1EA1i giao, Th\xE2n v\u1EADn b\u1EC7nh ch\u1EBFt, v\xEC B\xEDnh \u0111\u1EBFn ch\u1ED7 Th\xE2n, kh\xF3 \u0111\u01B0\u1EE3c s\u1ED1ng th\u1ECD v\u1EADy.","2. M\u1EC7nh b\u1EA7n ti\u1EC7n: Nh\xE2m Qu\xFD B\xEDnh \u0110inh T\xFD M\xE3o T\xFD D\u1EADu Kim th\u1EE7y kh\xE1 m\u1EA1nh, Nh\u1EADt nguy\xEAn v\xF4 c\u0103n, nh\u01B0ng c\xF3 \u0110inh M\xE3o, kh\xF4ng th\u1EC3 n\xF3i t\xF2ng, l\u1EA5y Nguy\u1EC7t l\u1EC7nh M\xE3o \u1EA4n l\xE0m d\u1EE5ng, nh\u01B0ng th\u1EA5y T\xFD h\xECnh D\u1EADu xung, h\u1ECFa v\u1EADn Canh y\u1EBFu, kim v\u1EADn ph\xE1 t\xE0i."]},"3":{thuongLy:"B\xEDnh sinh th\xE1ng Th\xECn, l\xE0 Th\u1EF1c th\u1EA7n n\u1EAFm l\u1EC7nh, B\xEDnh h\u1ECFa m\u1EA1nh d\u1EA7n, chuy\xEAn th\u1EE7 Nh\xE2m th\u1EE7y, M\u1EADu th\u1ED5 n\u1EAFm l\u1EC7nh, l\xE0 th\u1EE7y \u0111\u1EE5c kh\xF4ng qu\xFD, cho n\xEAn th\xE1ng ba d\u1EE5ng th\u1EA7n B\xEDnh h\u1ECFa b\u1ECF \u0111i, t\u1EA5t nhi\xEAn tr\u01B0\u1EDBc ti\xEAn xem M\u1EADu K\u1EF7 xu\u1EA5t can hay kh\xF4ng m\xE0 \u0111\u1ECBnh; m\u1ED9t th\u1ED5 xu\u1EA5t ra can, t\u1EA5t ph\u1EA3i th\u1EA5y Gi\xE1p.",bienLy:["Th\xE2n c\u01B0\u1EDDng, chuy\xEAn d\u1EE5ng Nh\xE2m th\u1EE7y, th\u1EE7y nh\u01B0\u1EE3c, ph\u1EE5 l\u1EA5y Canh T\xE2n; c\xE0ng \u0111\u1EB9p c\xF3 Canh T\xE2n ti\u1EBFt kh\xED, l\xE0 Th\u1EF1c sinh T\xE0i, T\xE0i sinh S\xE1t, ph\xFA qu\xFD kh\xF4ng sai.","Th\xE2n nh\u01B0\u1EE3c, tr\u01B0\u1EDBc ti\xEAn th\u1EE7 Gi\xE1p m\u1ED9c, nh\u01B0ng c\u1EA7n c\xF3 Nh\xE2m ph\u1EE5 gi\xFAp, l\xE0 S\xE1t \u1EA4n t\u01B0\u01A1ng sinh, ph\xFA qu\xFD l\xE0 kh\xF4ng \xEDt. Nh\xE2m Gi\xE1p c\xF9ng th\u1EA5u, t\u1EA5t nhi\xEAn ph\xFA qu\xFD, m\u1ED9t th\u1EA5u m\u1ED9t t\xE0ng, c\u0169ng c\xF3 l\u1EE3i danh.","Th\xE2n c\u01B0\u1EDDng, kh\xF4ng c\xF3 Nh\xE2m d\u1EE5ng Qu\xFD; th\xE2n nh\u01B0\u1EE3c, kh\xF4ng c\xF3 Gi\xE1p d\u1EE5ng \u1EA4t; duy c\xF3 ph\u1ED1i h\u1EE3p h\u01A1i k\xE9m, ph\xFA qu\xFD \u0111\u1EC1u \xEDt.","Th\xE2n c\u01B0\u1EDDng d\u1EE5ng Th\u1EF1c Th\u01B0\u01A1ng ti\u1EBFt kh\xED, ph\xFA nhi\u1EC1u qu\xFD \xEDt."],viDu:["1. M\u1EC7nh Qu\xE1ch T\xF9ng Linh: Qu\xFD B\xEDnh B\xEDnh M\u1EADu M\xF9i Th\xECn Ng\u1ECD T\xFD Th\xE2n c\u01B0\u1EDDng h\u1EF7 kh\u1EAFc, kh\xF4ng c\xF3 Nh\xE2m d\u1EE5ng Qu\xFD, M\u1EADu Qu\xFD h\u1EE3p nh\u1EA5t, d\u1EE5ng th\u1EA7n b\u1ECB ch\u1EBF; chi d\u01B0\u1EDBi c\xF3 T\xFD Ng\u1ECD xung nhau, c\u0169ng ng\u1EA1i c\xF3 hung c\u01A1. V\u1EADn Qu\xFD S\u1EEDu n\u1EAFm l\u1EA5y binh ph\xF9, v\u1EADn Nh\xE2m T\xFD v\u1ED1n l\xE0 t\u1ED1t, g\u1EB7p n\u0103m Gi\xE1p T\xFD, ba T\xFD c\xF9ng xung Nh\u1EADn, ch\u1EBFt v\xEC tai n\u1EA1n.","2. Qu\xFD m\u1EC7nh: \u1EA4t Canh B\xEDnh Canh H\u1EE3i Th\xECn T\xFD D\u1EA7n Th\xE2n h\u01A1i m\u1EA1nh \u1EDF S\xE1t, d\u1EE5ng S\xE1t kh\xF4ng ng\u1EA1i, v\u1EADn nh\u1EADp B\u1EAFc ph\u01B0\u01A1ng \u0111\u1EA5t S\xE1t v\u01B0\u1EE3ng, \u0111\u1EA7y \u0111\u1EE7 ph\xFA qu\xFD."]},"4":{thuongLy:"B\xEDnh sinh th\xE1ng T\u1ECB, Nh\u1EADt nguy\xEAn \u0111\u1EAFc l\u1ED9c, chuy\xEAn d\u1EE5ng Nh\xE2m th\u1EE7y, th\u1EE7y nh\u01B0\u1EE3c c\u1EA7n c\xF3 g\u1ED1c Canh T\xE2n ph\xE1t nguy\xEAn; \u0111i\u1EC1u h\u1EADu l\xE0 g\u1EA5p, kh\xF4ng c\xF3 Nh\xE2m d\u1EE5ng Qu\xFD; ph\u1ED1i h\u1EE3p h\u01A1i k\xE9m, ph\xFA qu\xFD l\xE0 nh\u1ECF; chi th\u1EA5y ch\u1EEF Th\xE2n, c\u0169ng c\xF3 danh l\u1EE3i, H\u1EE3i T\xFD xung th\xE1ng, trong th\xE0nh c\xF3 b\u1EA1i.",bienLy:["N\xF3i chung, B\xEDnh \u1EDF th\xE1ng 4, l\xE0 qu\xE1 n\xF3ng ch\u1EDB nh\u1EADn; th\u1EA5y Canh Nh\xE2m c\xF9ng th\u1EA5u, kh\xF4ng c\xF3 M\u1EADu ch\u1EBF Nh\xE2m l\xE0m m\u1EDD B\xEDnh, ph\xFA qu\xFD kh\xF4ng nh\u1EB9; Canh Qu\xFD c\xF9ng th\u1EA5u, ph\xFA nhi\u1EC1u qu\xFD \xEDt.","N\u1EBFu \u0111\u1EA7y b\xE0n \u0111\u1EC1u l\xE0 kim, kh\xF4ng th\u1EA5y T\u1EC9 Ki\u1EBFp, g\u1ECDi l\xE0 \u300E H\u1ECFa tr\u01B0\u1EDDng h\u1EA1 thi\xEAn kim \u0111i\u1EC7p \u0111i\u1EC7p \u300F, l\xE0 m\u1EC7nh \u0111\u1EA1i ph\xFA; tu\u1EBF v\u1EADn l\u1EA5y T\xE2y B\u1EAFc l\xE0 t\u1ED1t, \u0110\xF4ng Nam l\xE0 tai \u01B0\u01A1ng.","\u0110inh h\u1ECFa xu\u1EA5t can, chi th\u1EA5y Ng\u1ECD Nh\u1EADn, l\u1EA1i g\u1EB7p Nh\xE2m th\u1EA5u, danh vi\u1EBFt \u300E D\u01B0\u01A1ng Nh\u1EADn h\u1EE3p S\xE1t \u300F, uy quy\u1EC1n hi\u1EC3n h\xE1ch.","N\u1EBFu th\xE2n nh\u01B0\u1EE3c, kh\xF4ng ngo\xE0i d\u1EE5ng Gi\xE1p \u1EA4n, l\xFD l\u1EBD gi\u1ED1ng th\xE1ng ba.","Th\xE2n nh\u01B0\u1EE3c d\u1EE5ng T\u1EC9 Ki\u1EBFp c\u0169ng \u0111\u01B0\u1EE3c, l\xE0 \u0110\u1ECBch S\xE1t th\xEC qu\xFD, ph\xE2n T\xE0i th\xEC ph\xFA, ch\u1ED7 n\xE0y ch\xEDnh l\xE0 m\u1EC7nh l\xFD th\xF4ng l\u1EC7."],viDu:["1. M\u1EC7nh \u0111\u1EA1i qu\xFD: Nh\xE2m \u1EA4t B\xEDnh \u0110inh D\u1EA7n T\u1ECB Th\xECn D\u1EADu B\xEDnh h\u1ECFa m\xE3nh li\u1EC7t, \u0110inh Ki\u1EBFp xu\u1EA5t can, d\u1EE5ng Nh\xE2m h\u1EE3p T\xFD; T\u1ECB D\u1EADu b\xE1n h\u1ED9i kim c\u1EE5c h\u1ED9i cu\u1ED9c chi\u1EBFn l\u0169 l\u1EE5t, v\u1EADn h\xE0nh kim th\u1EE7y, danh l\u1EE3i song huy.","2. M\u1EC7nh hung y\u1EC3u: T\xE2n Qu\xFD B\xEDnh \u0110inh S\u1EEDu T\u1ECB T\xFD D\u1EADu B\xEDnh sinh th\xE1ng t\u01B0, h\u1ECFa l\xE0 kh\xED v\u01B0\u1EE3ng; duy c\xF3 chi th\xE0nh kim c\u1EE5c, thi\xEAn can kim th\u1EE7y, l\xE0 m\u1EC7nh S\xE1t tr\u1ECDng th\xE2n nh\u01B0\u1EE3c; v\u1EADn Nh\xE2m n\u0103m T\xE2n H\u1EE3i S\xE1t c\u01B0\u1EDDng l\u1EA1i \u0111\u1EBFn kh\u1EAFc th\xE2n, ch\u1EBFt y\u1EC3u."]},"5":{thuongLy:"B\xEDnh sinh th\xE1ng Ng\u1ECD, Nh\u1EADt nguy\xEAn l\xE0 D\u01B0\u01A1ng Nh\u1EADn. Th\xE2n c\u01B0\u1EDDng, chuy\xEAn d\u1EE5ng Nh\xE2m th\u1EE7y, Canh T\xE2n l\xE0 ph\u1EE5 gi\xFAp, Canh Nh\xE2m c\xF9ng th\u1EA5u, ph\xFA qu\xFD song to\xE0n; m\u1ED9t khi th\u1EA5y \u0110inh h\u1EE3p M\u1EADu ch\u1EBF, th\xEC l\xE0 th\u01B0\u1EDDng nh\xE2n.",bienLy:["Chi th\u1EA5y Th\xE2n kim, trong c\xF3 kim th\u1EE7y t\u01B0\u01A1ng sinh, \u0111\u01B0\u1EE3c v\u1EADn c\u1EE9u gi\xFAp, c\u0169ng c\xF3 th\u1EC3 kh\xE1 ph\xE1t.","Th\xE2n c\u01B0\u1EDDng n\u1EBFu g\u1EB7p hai Nh\xE2m m\u1ED9t Canh xu\u1EA5t can, l\xE0 \u0111\u1EA1i ph\xFA \u0111\u1EA1i qu\xFD, c\xF2n l\u1EA1i \u0111\u1EC1u gi\u1ED1ng th\xE1ng t\u01B0.","Ba th\xE1ng m\xF9a H\u1EA1 h\u1ECFa n\u1EAFm l\u1EC7nh, l\xFD l\xE0 th\xE2n nh\u01B0\u1EE3c qu\xE1 m\u1EE9c, nh\u01B0ng n\u1EBFu th\xE2n nh\u01B0\u1EE3c, v\u1EABn d\u1EE5ng Gi\xE1p \u1EA4n, nh\u01B0ng ph\u1EA3i c\xF3 Nh\xE2m ph\u1EE5 l\xE0 qu\xFD, l\xE0 S\xE1t \u1EA4n t\u01B0\u01A1ng sinh, ph\xFA qu\xFD kh\xF4ng \xEDt.","N\u1EBFu Nh\xE2m th\u1EE7y qu\xE1 nhi\u1EC1u, ho\u1EB7c chi th\xE0nh th\u1EE7y ph\u01B0\u01A1ng th\u1EE7y c\u1EE5c, tr\xE1i l\u1EA1i th\u1EE7 Ng\u1ECD trong c\xF3 \u0110inh K\u1EF7 l\xE0m d\u1EE5ng, l\xE0 ch\xE2n th\u1EA7n \u0111\u1EAFc d\u1EE5ng, ph\xFA qu\xFD kh\xF4ng nh\u1EB9.","Tr\u1EE5 kh\xF4ng c\xF3 kim th\u1EE7y, chi th\xE0nh h\u1ECFa ph\u01B0\u01A1ng h\u1ECFa c\u1EE5c, c\xF3 Gi\xE1p \u1EA4t th\u1EA5u tr\u1EE3, c\xE1ch th\xE0nh Vi\xEAm Th\u01B0\u1EE3ng, ph\xFA qu\xFD l\xE0 th\u01B0\u1EE3ng c\xE1ch; v\u1EADn h\xE0nh \u0110\xF4ng Nam l\xE0 ph\xFAc, T\xE2y B\u1EAFc l\xE0 g\u1EB7p tai \u01B0\u01A1ng."],viDu:["1. M\u1EC7nh quy\u1EC1n qu\xFD: B\xEDnh Gi\xE1p B\xEDnh Nh\xE2m D\u1EA7n Ng\u1ECD Th\xE2n Th\xE2n Th\xE2n c\u01B0\u1EDDng d\u1EE5ng Nh\xE2m, l\u1EA1i \u0111\u01B0\u1EE3c chi ng\xE0y Th\xE2n kim l\xE0 g\u1ED1c ph\xE1t th\u1EE7y; c\xE0ng h\u1EF7 v\u1EADn ch\u1EA1y T\xE2y B\u1EAFc, quan ch\u1EE9c th\u0103ng li\xEAn t\u1EE5c; c\xF3 Nh\u1EADn c\xF3 S\xE1t, l\xE0 n\u1EAFm quy\u1EC1n sinh s\xE1t v\u1EADy.","2. M\u1EC7nh b\xECnh th\u01B0\u1EDDng: M\u1EADu M\u1EADu B\xEDnh K\u1EF7 Tu\u1EA5t Ng\u1ECD Th\xECn S\u1EEDu Th\xE2n c\u01B0\u1EDDng c\xF3 th\u1EC3 d\u1EE5ng K\u1EF7 ti\u1EBFt, nh\u01B0ng th\u1EA5y M\u1EADu h\u1ED7n; nguy\xEAn c\u1EE5c kh\xF4ng c\xF3 T\xE0i, kh\xF4ng th\u1EC3 l\u1EA5y Th\u1EF1c Th\u01B0\u01A1ng sinh T\xE0i lu\u1EADn; v\u1EADn nh\u1EADp T\xE2y B\u1EAFc, b\u1EA5t qu\xE1 y th\u1EF1c \u01B0u du, kh\xF4ng th\u1EC3 ph\xE1t ph\xFA ph\xE1t qu\xFD, nguy\xEAn nh\xE2n l\xE0 do nguy\xEAn m\u1EC7nh c\xE1ch d\u1EE5ng hai T\xE0i."]},"6":{thuongLy:"B\xEDnh sinh th\xE1ng M\xF9i, Th\u01B0\u01A1ng quan n\u1EAFm l\u1EC7nh; tr\u01B0\u1EDBc ti\u1EBFt \u0110\u1EA1i Th\u1EED, l\xE0 h\u1ECFa vi\xEAm th\u1ED5 t\xE1o, th\u1EE7 d\u1EE5ng v\u1EABn gi\u1ED1ng nh\u01B0 th\xE1ng 5. Sau ti\u1EBFt \u0110\u1EA1i Th\u1EED, nguy\xEAn c\u1EE5c n\u1EBFu thu\u1ED9c h\u1ECFa th\u1ED5 l\u01B0\u1EE1ng v\u01B0\u1EE3ng, d\u1EE5ng th\u1EA7n v\u1EABn kh\xF4ng xa r\u1EDDi Nh\xE2m Canh, l\xFD ch\u1ED7 n\xE0y t\u1EE9c l\xE0 th\xE2n c\u01B0\u1EDDng d\u1EE5ng T\xE0i S\xE1t. N\u1EBFu S\xE1t th\xE2n nh\u01B0\u1EE3c, v\u1EABn d\u1EE5ng Gi\xE1p \u1EA4n, c\u0169ng c\u1EA7n th\u1EA5y Nh\xE2m, l\xE0 S\xE1t \u1EA4n t\u01B0\u01A1ng sinh, ph\xFA qu\xFD c\xF3 chu\u1EA9n.",bienLy:["Th\xE1ng M\xF9i h\u1ECFa th\u1ED5 \u0111\u1EC1u l\xE0 v\u01B0\u1EE3ng kh\xED, n\u1EBFu h\u1ECFa c\u01B0\u1EDDng th\u1ED5 c\xE0ng c\u01B0\u1EDDng \u0111\u01B0\u1EE3c kim ti\u1EBFt th\u1ED5 v\u01B0\u1EE3ng kh\xED, l\xE0 H\u1ECFa th\u1ED5 Th\u01B0\u01A1ng quan d\u1EE5ng T\xE0i, c\xE1ch t\u1EA5t l\xE0 ph\xFA; nh\u01B0ng ph\u1EA3i l\u1EA5y th\xE2n c\u01B0\u1EDDng, b\u1EDFi v\xEC th\xE2n nh\u01B0\u1EE3c kh\xF4ng th\u1EC3 \u0111\u1EA3m nh\u1EADn T\xE0i v\u1EADy.","N\u1EBFu nguy\xEAn c\u1EE5c th\u1ED5 v\u01B0\u1EE3ng ti\u1EBFt h\u1ECFa, \u0111\u01B0\u1EE3c Gi\xE1p \u1EA4t xu\u1EA5t ra can, ch\u1EBF th\u1ED5 sinh th\xE2n, danh l\xE0 \u300E H\u1ECFa th\u1ED5 Th\u01B0\u01A1ng quan b\u ED1t.",bienLy:["T\xE0i v\u01B0\u1EE3ng ph\xE1 \u1EA4n, ho\u1EB7c th\u1EA5y S\xE1t \u0111\u1EBFn \u0111i\u1EC1u gi\u1EA3i c\u0169ng t\u1ED1t, cho n\xEAn th\xE2n nh\u01B0\u1EE3c th\u1EA5y Nh\xE2m Gi\xE1p kh\xF4ng th\u1EA5u, t\u1EA5t l\xE0 qu\xFD.","Th\xE2n S\xE1t l\u01B0\u1EE1ng c\u01B0\u1EDDng, th\xE1ng M\u1EADu Th\u1EF1c ch\u1EBF S\xE1t, \u0111a s\u1ED1 l\u1EA5y v\u0169 qu\xFD.","Ho\u1EB7c l\xE0 Nh\xE2m nhi\u1EC1u th\u1EA5y m\u1ED9t M\u1EADu, t\u1EA5t l\xE0 n\u1EAFm quy\u1EC1n vinh hi\u1EC3n.","T\xE0i \u0111a th\xE2n nh\u01B0\u1EE3c, chuy\xEAn d\u1EE5ng T\u1EC9 Ki\u1EBFp l\xE0 ph\xFA, nh\u01B0ng m\xE0 B\xEDnh \u1EDF th\xE1ng Th\xE2n, trong Th\xE2n c\xF3 Nh\xE2m, th\xEC kh\xF4ng ch\u1EC9 c\xF3 ph\xFA, m\xE0 l\u1EA1i c\xF2n c\xF3 qu\xFD."],viDu:["1. Qu\xFD m\u1EC7nh: Gi\xE1p Nh\xE2m B\xEDnh Qu\xFD D\u1EA7n Th\xE2n T\xFD T\u1ECB Quan S\xE1t h\u1ED7n t\u1EA1p, \u0111\u01B0\u1EE3c Gi\xE1p m\u1ED9c h\xF3a; Nh\u1EADt nguy\xEAn, \u1EA4n S\xE1t \u0111\u1EC1u \u0111\u01B0\u1EE3c g\u1ED1c m\u1EA1nh (c\u01B0\u1EDDng c\u0103n), v\u1EC1 sau h\xE0nh v\u1EADn th\u1EE7y m\u1ED9c, ph\xFA qu\xFD hi\u1EC3n h\xE1ch.","2. M\u1EC7nh Th\xE1i th\xFA: M\u1EADu Canh B\xEDnh M\u1EADu Th\xE2n Th\xE2n Th\xECn Tu\u1EA5t T\xF2ng T\xE0i c\xE1ch, c\u0103n B\xEDnh \u1EDF Tu\u1EA5t, h\u1EF7 c\xF3 ch\u1EEF Th\xECn xung kh\u1EED; v\u1EADn nh\u1EADp B\u1EAFc ph\u01B0\u01A1ng, c\u0169ng h\u1EE3p qu\xFD hi\u1EC3n."]},"8":{thuongLy:"B\xEDnh sinh th\xE1ng D\u1EADu, T\xE0i tinh n\u1EAFm l\u1EC7nh, th\u1EE7 \u1EDF th\xE2n c\u01B0\u1EDDng c\xF3 th\u1EC3 \u0111\u1EA3m nh\u1EADn, chi th\xF4ng D\u1EA7n T\u1ECB Ng\u1ECD l\xE0 t\u1ED1t.",bienLy:["Th\xE2n c\u01B0\u1EDDng \u0111\u01B0\u1EE3c Nh\xE2m th\u1EA5u, ph\xFA qu\xFD l\u01B0\u1EE1ng to\xE0n; Nh\xE2m th\u1EE7y \xE1m t\xE0ng, ti\u1EC3u danh ti\u1EC3u l\u1EE3i.","Kh\xF4ng c\xF3 Nh\xE2m d\u1EE5ng Qu\xFD,nh\u01B0ng ph\xFA qu\xFD kh\xF4ng d\xE0i. Nh\xE2m Qu\xFD kh\xF4ng th\u1EA5y, c\xF4ng danh kh\xF4ng c\xF3 ph\u1EA7n.","Th\xE2n c\u01B0\u1EDDng d\u1EE5ng Nh\xE2m, nh\ n, l\u1EA1i c\u1EA7n th\u1EA5y M\u1EADu; nh\u01B0ng Th\u1EF1c th\u1EA7n ch\u1EBF S\xE1t, ph\u1EA3i th\u1EE7 th\xE2n c\u01B0\u1EDDng, n\u1EBFu kh\xF4ng, v\u1EABn th\u1EE7 \u1EA4n tinh h\xF3a S\xE1t l\xE0 t\u1ED1t.","B\xEDnh h\u1ECFa \u0111\u01B0\u1EE3c L\u1ED9c Nh\u1EADn, ho\u1EB7c th\xE0nh h\u1ECFa ph\u01B0\u01A1ng h\u1ECFa c\u1EE5c, chuy\xEAn th\u1EE7 nguy\u1EC7t l\u1EC7nh Nh\xE2m th\u1EE7y l\xE0m d\u1EE5ng, l\xE0 ch\xE2n th\u1EA7n \u0111\u1EAFc d\u1EE5ng, ph\xFA qu\xFD kh\xF4ng nh\u1EB9.","B\xEDnh h\u1ECFa l\u1EA5y Nh\xE2m th\u1EE7 qu\xFD, v\u1ED1n k\u1ECB M\u1EADu K\u1EF7 l\xE0m th\u1EE7y \u0111\u1EE5c, nh\u01B0ng B\xEDnh \u1EDF th\xE1ng 10 l\xE0 nh\u01B0\u1EE3c c\xF2n Nh\xE2m l\xE0 c\u01B0\u1EDDng, kh\xF4ng c\xF3 Gi\xE1p th\u1EA5u, th\u1EA5y M\u1EADu K\u1EF7 xu\u1EA5t ra can, b\u1EDFi v\xEC trong H\u1EE3i c\xF3 Gi\xE1p, chuy\xEAn th\u1EE7 K\u1EF7 th\u1ED5 h\u1ED7n Nh\xE2m b\u1ED3i m\u1ED9c, danh l\xE0\u300E K\u1EF7 th\u1ED5 h\u1ED7n Nh\xE2m c\xE1ch \u300F, l\xE0 c\xE1ch ph\xFA qu\xFD, v\u1EADn h\xE0nh Nam ph\u01B0\u01A1ng, t\u1EA5t ch\u1EE7 qu\xFD hi\u1EC3n.","N\u1EBFu can th\u1EA5y T\xE2n, chi th\u1EA5y Th\xECn, l\u1EA1i th\u1EA5y th\u1EE7y nhi\u1EC1u, danh l\xE0 \u300E H\xF3a h\u1EE3p \u0111\u1EAFc th\u1EDDi\u300F, c\xE1ch \u0111\u1EA1i qu\xFD."],viDu:["1. M\u1EC7nh T\u1EA3 T\xF4ng \u0110\u01B0\u1EDDng: Nh\xE2m T\xE2n B\xEDnh Canh Th\xE2n H\u1EE3i Ng\u1ECD D\u1EA7n Nh\xE2m th\u1EE7y th\u1EA5u ra, h\u1EF7 Gi\xE1p t\xE0ng b\xEAn trong D\u1EA7n, H\u1EE3i c\u0169ng t\xE0ng Gi\xE1p; \u0111i\u1EC1n chi D\u01B0\u01A1ng Nh\u1EADn, l\xE0 S\xE1t \u1EA4n t\u01B0\u01A1ng t\u1EBF; uy quy\u1EC1n v\u1EA1n l\xFD, m\u1ED9t \u0111\u01B0\u1EDDng m\u1ED9c h\u1ECFa, ph\xFA qu\xFD \u0111\u1EA7y \u0111\u1EE7.","2. M\u1EC7nh ph\xFA qu\xFD th\u1ECD kh\u1EA3o: T\xE2n K\u1EF7 B\xEDnh Nh\xE2m T\u1ECB H\u1EE3i T\xFD Th\xECn L\u1EA5y K\u1EF7 th\u1ED5 h\u1ED7n Nh\xE2m, ki\xEAm d\u1EE5ng H\u1EE3i trong c\xF3 Gi\xE1p m\u1ED9c, trong v\u1EADn sau h\xE0nh m\u1ED9c h\u1ECFa, th\u1ECD \u0111o\xE1 im th\u1EE7y, qu\xFD phong B\xE1 t\u01B0\u1EDBc.","2. Qu\xFD m\u1EC7nh: Gi\xE1p K\u1EF7 Qu\xFD M\u1EADu Ng\u1ECD T\u1ECB M\xF9i Ng\u1ECD \u0110\u1ECBa chi h\u1ED9i h\u1ECFa ph\u01B0\u01A1ng, Qu\xFD nh\u01B0\u1EE3c v\xF4 c\u0103n, may m\u1EAFn h\u1EE3p th\xE0nh qu\xFD h\xF3a h\u1ECFa, c\xE1ch c\u1EE5c kh\xE1 ch\xE2n, qu\xFD l\xE0m Tham Ch\xEDnh; \u0111\xE1ng ti\u1EBFc v\u1EADn ch\u1EA1y T\xE2y B\u1EAFc, x\u1EE9 cao ch\u1ECBu kh\xF4ng n\u1ED7i h\xE0n l\u1EA1nh v\u1EADy."]},"5":{thuongLy:"Qu\xFD sinh th\xE1ng Ng\u1ECD, T\xE0i tinh n\u1EAFm l\u1EC7nh, \u0110inh K\u1EF7 n\u1EAFm quy\u1EC1n, Qu\xFD th\u1EE7y c\u1EF1c nh\u01B0\u1EE3c; th\xE2n nh\u01B0\u1EE3c, tr\u01B0\u1EDBc th\u1EE7 Nh\xE2m th\u1EE7y, sau th\u1EE7 Canh kim, d\u1EE5ng Ki\u1EBFp \u1EA4n l\u1EABn nhau, m\u1EDBi ch\u1EE7 ph\xFA qu\xFD.",bienLy:["N\u1EBFu nguy\xEAn c\u1EE5c c\xF3 kim kh\xF4ng c\xF3 th\u1EE7y, kim b\u1ECB h\u1ECFa h\u1EA1i, t\xE1o kim kh\xF4ng th\u1EC3 sinh th\u1EE7y, th\u01B0\u1EDDng nh\xE2n m\xE0 th\xF4i.","N\u1EBFu nguy\xEAn c\u1EE5c Qu\xFD th\u1EE7y chuy\u1EC3n c\u01B0\u1EDDng, l\u1EA1i d\u1EE5ng Nguy\u1EC7t l\u1EC7nh \u0110inh K\u1EF7, l\xE0 ch\xE2n th\u1EA7n \u0111\u1EAFc d\u1EE5ng, ph\xFA qu\xFD kh\xF4ng nh\u1EB9;","N\u1EBFu nguy\xEAn c\u1EE5c kh\xF4ng c\xF3 \u1EA4n Ki\u1EBFp, chi d\u01B0\u1EDBi nhi\u1EC1u h\u1ECFa, l\u1EA1i th\u1EA5y K\u1EF7 th\u1ED5 xu\u1EA5t ra can, c\xF3 th\u1EC3 l\u1EA5y T\xF2ng S\xE1t c\xE1ch lu\u1EADn, l\xE0 m\u1EC7nh ph\xFA qu\xFD. B\u1EDFi v\xEC trong Ng\u1ECD c\xF3 \u0110inh K\u1EF7 \u0111\u1ED3ng cung, l\xE0 ch\xE2n th\u1EA7n \u0111\u1EAFc d\u1EE5ng, ph\xFA qu\xFD kh\xF4ng sai, th\u1EA5y m\u1ED9t Gi\xE1p \u1EA4t ph\xE1 c\xE1ch, l\xE0 k\u1EBB b\u1EA7n ti\u1EC7n."],viDu:["1. Qu\xFD m\u1EC7nh: M\u1EADu M\u1EADu Qu\xFD Canh T\xFD Ng\u1ECD S\u1EEDu Th\xE2n Quan c\u01B0\u1EDDng th\xE0nh S\xE1t, h\u1EF7 h\u1ECFa kh\xF4ng xu\u1EA5t can, gi\u1EDD th\u1EA5y g\u1ED1c Canh Th\xE2n ph\xE1t nguy\xEAn, v\u1EADn ch\u1EA1y T\xE2y B\u1EAFc, l\xE0m quan t\u1EDBi ch\u1EE9c Th\u1E  ti\u1EC3u ph\xFA ti\u1EC3u qu\xFD."],viDu:["1. Qu\xFD m\u1EC7nh: \u0110inh M\u1EADu Qu\xFD \u1EA4t T\u1ECB Th\xE2n S\u1EEDu M\xE3o N\u1EEF m\u1EC7nh. M\u1EC7nh g\u1EB7p kh\u1EAFc ti\u1EBFt giao gia, d\u1EE5ng nguy\u1EC7t l\u1EC7nh g\u1ED1c Th\xE2n kim ph\xE1t nguy\xEAn ( l\xE0m g\u1ED1c ph\xE1t sinh), v\u1EADn h\xE0nh T\xE2y B\u1EAFc, phu vinh t\u1EED qu\xFD.","2. M\u1EC7nh ph\xFA qu\xFD: M\u1EADu Canh Qu\xFD \u1EA4t Ng\u1ECD Th\xE2n M\xF9i M\xE3o Qu\xFD th\u1EE7y r\u1EA5t nh\u01B0\u1EE3c, chi d\u01B0\u1EDBi v\xF4 c\u0103n, nguy\xEAn m\u1EC7nh g\u1EB7p kh\u1EAFc ti\u1EBFt giao gia, n\xEAn th\u1EE7 nguy\u1EC7t l\u1EC7nh Canh kim l\xE0 d\u1EE5ng; v\u1EADn nh\u1EADp T\xE2y B\u1EAFc, ph\xFA m\xE0 c\xF2n qu\xFD."]},"8":{thuongLy:"Qu\xFD sinh th\xE1ng D\u1EADu, \u1EA4n tinh n\u1EAFm l\u1EC7nh, Qu\xFD th\u1EE7y r\u1EA5t nh\u01B0\u1EE3c, v\u01B0\u1EE3ng m\xE0 kh\xF4ng tr\xE0n; \u0111\u01B0\u1EE3c T\xE2n kim th\xE1ng 8 sinh, ch\xEDnh l\xFAc kim b\u1EA1ch th\u1EE7y thanh; c\xF3 T\xE2n th\xEC g\u1ED1c ch\u1EA3y d\xE0i xa, c\xF3 B\xEDnh th\xEC s\u01B0\u1EDFi \u1EA5m to\xE0n c\u1EE5c; cho n\xEAn th\xE2n nh\u01B0\u1EE3c, th\u1EA5y B\xEDnh T\xE2n c\xF9ng th\u1EA5u, c\xE1ch ng\xF4i kh\xF4ng ng\u1EA1i h\u1EE3p, ph\xFA qu\xFD l\xE0 c\xF3 chu\u1EA9n; B\xEDnh th\u1EA5u T\xE2n t\xE0ng, c\u0169ng c\xF3 c\xF4ng danh; t\u1ED1i k\u1ECB \u0110inh \u0111\u1EBFn l\xE0m t\u1ED5n th\u01B0\u01A1ng T\xE2n, B\xEDnh T\xE2n k\u1EC1 nhau t\u01B0\u01A1ng h\u1EE3p, c\u1EA3 hai \u0111\u1EC1u m\u1EA5t d\u1EE5ng.",bienLy:["N\u1EBFu can th\u1EA5y Nh\xE2m, chi th\xE0nh ph\u01B0\u01A1ng th\u1EE7y c\u1EE5c; Qu\xFD th\u1EE7y chuy\u1EC3n c\u01B0\u1EDDng th\xEC l\u1EA1i kh\xF4ng th\u1EC3 kh\xF4ng c\xF3 M\u1EADu ng\u0103n th\u1EE7y, B\xEDnh h\u1ECFa ph\xF2 t\xE1.","C\u1EE5c \u0111\u1EA7y kim, \u0111\u01A1n \u0111\u1ED9c Nh\u1EADt nguy\xEAn c\xF3 m\u1ED9t \u0111i\u1EC3m Qu\xFD th\u1EE7y, danh l\xE0\u300E Th\u1EC3 to\xE0n chi t\u01B0\u1EE3ng \u300F, ph\xFA qu\xFD kh\xF4ng nh\u1EB9.","To\xE0n c\u1EE5c ch\u1EC9 \u011
